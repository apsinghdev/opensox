version: '3.8'
services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=opensox
      - POSTGRES_PASSWORD=opensox
      - POSTGRES_DB=opensox
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    depends_on:
      - postgres
    env_file:
      - ./apps/api/.env
    environment:
    - DATABASE_URL=postgresql://opensox:opensox@postgres:5432/opensox?schema=public


volumes:
  postgres_data: